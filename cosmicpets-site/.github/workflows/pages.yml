name: Deploy to GitHub Pages

# Manual only, because the site has not launched yet and Pages is switched off.
# Leaving the push trigger on would make every commit fail with a red X.
#
# TO GO LIVE:
#   1. Settings > Pages > Source: GitHub Actions.
#      (Needs a public repo on GitHub Free. Private repos need GitHub Pro.)
#   2. Uncomment the push trigger below so every commit deploys.
#   3. Rename CNAME.disabled to CNAME once the DNS records point at GitHub.
#
# on:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
