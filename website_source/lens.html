<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: 'Aventi';
    src: url('fonts/AventiBold.woff2') format('woff2'),
         url('fonts/AventiBold.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: oklch(7% 0.012 50);
    --ink: oklch(92% 0.01 80);
    --ink-soft: oklch(58% 0.01 80);
    --coral: oklch(56% 0.185 29);
    --serif: 'Fraunces', Georgia, serif;
    --text: 'Newsreader', Georgia, serif;
    --mono: 'Fragment Mono', 'Courier New', monospace;
    --nav-h: 60px;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
    background-size: 220px;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: var(--nav-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    background: linear-gradient(to bottom, oklch(7% 0.012 50 / 0.95) 0%, transparent 100%);
  }
  .nav-logo {
    font-family: var(--serif); font-size: 20px;
    color: var(--ink); text-decoration: none; letter-spacing: 0.02em;
  }
  .nav-logo em { color: var(--coral); font-style: italic; }
  .nav-back {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-soft); text-decoration: none;
    transition: color 0.2s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .nav-back:hover { color: var(--coral); }
  .nav-back-x { font-family: var(--serif); font-size: 24px; font-weight: 300; letter-spacing: 0; line-height: 1; }

  main {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--nav-h) + 40px) 24px 80px;
  }
  .lens-eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--ink-soft);
    animation: rise 0.9s ease 0.1s both;
  }
  h1 {
    font-family: 'Aventi', var(--serif); font-weight: 400;
    font-size: clamp(40px, 7vw, 84px); letter-spacing: -0.01em; line-height: 1.05;
    margin: 16px 0 56px; text-align: center;
    animation: rise 0.9s ease 0.2s both;
  }
  h1 span { color: var(--coral); }

  .series-list { width: min(680px, 100%); }
  .series {
    display: flex; align-items: center; gap: 24px;
    padding: 26px 6px;
    border-top: 1px solid oklch(92% 0.01 80 / 0.14);
    text-decoration: none; color: var(--ink);
    transition: background 0.25s;
    animation: rise 0.9s ease both;
  }
  .series:nth-child(2) { animation-delay: 0.3s; }
  .series:nth-child(3) { animation-delay: 0.4s; }
  .series:nth-child(4) { animation-delay: 0.5s; }
  .series:last-child { border-bottom: 1px solid oklch(92% 0.01 80 / 0.14); }
  .series img {
    width: 76px; height: 58px; object-fit: cover; border-radius: 8px;
    flex-shrink: 0;
    transition: transform 0.35s cubic-bezier(.23,1,.32,1);
  }
  .series:hover img { transform: scale(1.06) rotate(-1.5deg); }
  .series-name {
    font-family: 'Aventi', var(--serif); font-weight: 400;
    font-size: clamp(24px, 3.4vw, 38px); line-height: 1.1;
    flex: 1;
    transition: color 0.25s;
  }
  .series:hover .series-name { color: var(--accent, var(--coral)); }
  .series-count {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-soft);
    flex-shrink: 0;
  }
  .series-arrow {
    font-family: var(--serif); font-size: 22px; color: var(--ink-soft);
    transition: transform 0.25s, color 0.25s;
    flex-shrink: 0;
  }
  .series:hover .series-arrow { transform: translateX(5px); color: var(--accent, var(--coral)); }

  .lens-foot {
    margin-top: 64px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: oklch(40% 0.01 80);
    animation: rise 0.9s ease 0.6s both;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .lens-eyebrow, h1, .series, .lens-foot { animation: none; }
  }

  @media (max-width: 600px) {
    nav { padding: 0 20px; }
    .series { gap: 16px; padding: 20px 2px; }
    .series img { width: 60px; height: 46px; }
    .series-count { display: none; }
  }
</style>
</head>

<main>
  <p class="lens-eyebrow">three series · 69 photographs</p>

  <p class="lens-foot">chongqing · chengdu · kunming</p>
