<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: 'Aventi';
    src: url('fonts/AventiBold.woff2') format('woff2'),
         url('fonts/AventiBold.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: oklch(7% 0.012 50);
    --ink: oklch(92% 0.01 80);
    --ink-soft: oklch(58% 0.01 80);
    --accent: oklch(72% 0.09 75);
    --serif: 'Fraunces', Georgia, serif;
    --text: 'Newsreader', Georgia, serif;
    --mono: 'Fragment Mono', 'Courier New', monospace;
    --nav-h: 60px;
    --bar-h: 64px;
  }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
    background-size: 220px;
  }

  /* ── opening title card ── */
  .album-title {
    position: fixed; inset: 0; z-index: 90;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--bg);
    pointer-events: none;
    animation: titleLift 1s ease 2.1s forwards;
  }
  .album-title h1 {
    font-family: 'Aventi', var(--serif); font-weight: 400;
    font-size: clamp(40px, 8vw, 92px); letter-spacing: -0.01em;
    color: var(--ink); text-align: center; line-height: 1.05;
    padding: 0 24px;
    animation: captionIn 0.9s ease 0.15s both;
  }
  .album-title h1 span { color: var(--accent); }
  .album-title .title-sub {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ink-soft);
    animation: captionIn 0.9s ease 0.45s both;
  }
  @keyframes titleLift { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .album-title { display: none; } }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: var(--nav-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    background: linear-gradient(to bottom, oklch(7% 0.012 50 / 0.95) 0%, transparent 100%);
  }
  .nav-logo {
    font-family: var(--serif); font-size: 20px;
    color: var(--ink); text-decoration: none; letter-spacing: 0.02em;
  }
  .nav-logo em { color: var(--accent); font-style: italic; }
  .nav-center {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-family: 'Aventi', var(--serif); font-size: 15px; letter-spacing: 0.02em;
    color: var(--ink);
  }
  .nav-back {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-soft); text-decoration: none;
    transition: color 0.2s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .nav-back:hover { color: var(--accent); }
  .nav-back-x { font-family: var(--serif); font-size: 24px; font-weight: 300; letter-spacing: 0; line-height: 1; }

  .stage {
    position: fixed;
    top: var(--nav-h); left: 0; right: 0;
    bottom: var(--bar-h);
    display: flex; align-items: center; justify-content: center;
    cursor: none;
  }

  .photo {
    position: absolute;
    max-width: 92vw;
    max-height: calc(100vh - var(--nav-h) - var(--bar-h) - 16px);
    width: auto; height: auto;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.38s ease;
    pointer-events: none;
    display: block;
  }
  .photo.visible { opacity: 1; }

  .zone {
    position: absolute; top: 0; bottom: 0; width: 38%;
    z-index: 10; display: flex; align-items: center;
  }
  .zone-prev { left: 0; justify-content: flex-start; cursor: w-resize; }
  .zone-next { right: 0; justify-content: flex-end; cursor: e-resize; }

  .zone-arrow {
    font-family: var(--serif); font-size: 28px; font-weight: 300;
    color: oklch(92% 0.01 80 / 0.0);
    padding: 24px 28px;
    transition: color 0.2s, transform 0.2s;
    line-height: 1; font-style: italic;
  }
  .zone-prev:hover .zone-arrow { color: oklch(92% 0.01 80 / 0.55); transform: translateX(-4px); }
  .zone-next:hover .zone-arrow { color: oklch(92% 0.01 80 / 0.55); transform: translateX(4px); }

  .cursor {
    position: fixed; z-index: 200; pointer-events: none;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s, opacity 0.15s;
    opacity: 0;
  }
  .cursor.visible { opacity: 1; }
  .cursor.large { width: 36px; height: 36px; background: transparent; border: 1px solid oklch(92% 0.01 80 / 0.4); }

  .bar {
    position: fixed; bottom: 2px; left: 0; right: 0;
    height: var(--bar-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    background: linear-gradient(to top, oklch(7% 0.012 50 / 0.95) 0%, transparent 100%);
    gap: 24px;
  }

  .caption {
    font-family: var(--text);
    font-size: 13px; font-style: italic;
    color: var(--ink-soft);
    line-height: 1.4; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .caption.in { animation: captionIn 0.35s ease both; }
  @keyframes captionIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .counter {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em; color: oklch(45% 0.01 80);
    flex-shrink: 0;
  }

  .progress {
    position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
    background: oklch(20% 0.01 50);
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.4s ease;
  }

  .hint {
    position: fixed; bottom: calc(var(--bar-h) + 8px); left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: oklch(30% 0.01 80);
    opacity: 1; animation: hintFade 3s 2s forwards;
    white-space: nowrap; pointer-events: none;
  }
  @keyframes hintFade { to { opacity: 0; } }

  @media (max-width: 600px) {
    :root { --bar-h: 88px; }
    nav { padding: 0 20px; }
    .nav-center { display: none; }
    .bar { padding: 0 20px; align-items: flex-start; padding-top: 10px; padding-bottom: 10px; }
    .zone-arrow { display: none; }
    .caption { white-space: normal; overflow: visible; text-overflow: clip; font-size: 12px; }
    .counter { padding-top: 2px; }
  }
</style>
</head>
<body>

<div class="album-title" aria-hidden="true">
  <h1>light <span>&amp;</span> texture.</h1>
  <p class="title-sub">25 studies · light, texture, material</p>
</div>

<nav>
  <a class="nav-logo" href="index.html">irina.<em>love</em></a>
  <span class="nav-center">light &amp; texture</span>
  <a class="nav-back" href="index.html#photography">close <span class="nav-back-x">×</span></a>
</nav>

<div class="stage" id="stage">
  <img class="photo" id="photoA" src="" alt="">
  <img class="photo" id="photoB" src="" alt="">

  <div class="zone zone-prev" id="zonePrev">
    <span class="zone-arrow">←</span>
  </div>
  <div class="zone zone-next" id="zoneNext">
    <span class="zone-arrow">→</span>
  </div>
</div>

<div class="bar">
  <span class="caption" id="caption"></span>
  <span class="counter" id="counter">01 / 25</span>
</div>

<div class="progress">
  <div class="progress-fill" id="progressFill" style="width: 4%"></div>
</div>

<div class="hint">use arrow keys or click the edges to turn pages</div>
<div class="cursor" id="cursor"></div>

<script>
const photos = [
  { src: 'uploads/photography/lights/01.webp', caption: 'Kunming · The city arrives through rain and grime on glass.' },
  { src: 'uploads/photography/lights/02.webp', caption: 'Kunming · A gap in the dirt. The street appears, golden.' },
  { src: 'uploads/photography/lights/03.webp', caption: 'Chongqing · The cable car cables draw lines across the sky.' },
  { src: 'uploads/photography/lights/04.webp', caption: 'Chongqing · Every balcony: laundry, an air unit, a life.' },
  { src: 'uploads/photography/lights/05.webp', caption: 'Chongqing · A line of yellow taxis, seen from the air.' },
  { src: 'uploads/photography/lights/06.webp', caption: 'Chongqing · The mountain holds the city.' },
  { src: 'uploads/photography/lights/07.webp', caption: 'Chongqing · The river at night. The bridge in gold.' },
  { src: 'uploads/photography/lights/08.webp', caption: 'Chongqing · The towers wear their lights into the purple hour.' },
  { src: 'uploads/photography/lights/09.webp', caption: 'Chongqing · Red lanterns, old rooftops, and behind them — glass.' },
  { src: 'uploads/photography/lights/10.webp', caption: 'Chongqing · One lantern. One city. One night.' },
  { src: 'uploads/photography/lights/11.webp', caption: 'Chongqing · The neon signs are saying everything at once.' },
  { src: 'uploads/photography/lights/12.webp', caption: 'Kunming · From an apartment window: orchid, rain streaks, a clock tower.' },
  { src: 'uploads/photography/lights/13.webp', caption: 'Chongqing · Below the forest café, pendant lights warm the afternoon.' },
  { src: 'uploads/photography/lights/14.webp', caption: 'Kunming · Look up. Only blossom.' },
  { src: 'uploads/photography/lights/15.webp', caption: 'Kunming · Shiitake, wood ear, wild mushrooms from the mountain.' },
  { src: 'uploads/photography/lights/16.webp', caption: 'Chongqing · Forty opera faces, waiting in amber light.' },
  { src: 'uploads/photography/lights/17.webp', caption: 'Chongqing · The Dragon Collection. 龙的故事.' },
  { src: 'uploads/photography/lights/18.webp', caption: 'Chongqing · The empress in phoenix crown and firelit red.' },
  { src: 'uploads/photography/lights/19.webp', caption: 'Chongqing · Dark origami armour. Pale chiffon beneath.' },
  { src: 'uploads/photography/lights/20.webp', caption: 'Chongqing · The deity raises a hand. The halo catches the light.' },
  { src: 'uploads/photography/lights/21.webp', caption: 'Chongqing · The embroidered face of Guanyin, thread by thread.' },
  { src: 'uploads/photography/lights/22.webp', caption: 'Chongqing · Gold skin, amber flowers, jade at the collar.' },
  { src: 'uploads/photography/lights/23.webp', caption: 'Chongqing · Tiny gold roses, stitched one by one.' },
  { src: 'uploads/photography/lights/24.webp', caption: 'Chongqing · Crystal chains fall from a sleeve of gold.' },
  { src: 'uploads/photography/lights/25.webp', caption: 'Chongqing · Silver thread, worked fine as breath.' },
];

const total = photos.length;
let current = 0;
let activeSlot = 'A';
let locked = false;
let safetyTimer = null;

const elA = document.getElementById('photoA');
const elB = document.getElementById('photoB');
const captionEl = document.getElementById('caption');
const counterEl = document.getElementById('counter');
const fillEl = document.getElementById('progressFill');
const cursor = document.getElementById('cursor');

function unlock() { locked = false; }

function updateUI(idx) {
  captionEl.textContent = photos[idx].caption;
  captionEl.classList.remove('in');
  void captionEl.offsetWidth;
  captionEl.classList.add('in');
  counterEl.textContent = `${String(idx + 1).padStart(2, '0')} / ${total}`;
  fillEl.style.width = `${((idx + 1) / total) * 100}%`;
}

function show(targetIdx) {
  if (locked) return;
  const target = ((targetIdx % total) + total) % total;
  if (target === current) return;

  locked = true;
  clearTimeout(safetyTimer);
  safetyTimer = setTimeout(unlock, 6000);

  const onEl  = activeSlot === 'A' ? elA : elB;
  const offEl = activeSlot === 'A' ? elB : elA;

  const loader = new Image();
  loader.onload = () => {
    offEl.src = loader.src;
    requestAnimationFrame(() => {
      offEl.classList.add('visible');
      onEl.classList.remove('visible');
      activeSlot = activeSlot === 'A' ? 'B' : 'A';
      current = target;
      updateUI(current);
      clearTimeout(safetyTimer);
      safetyTimer = setTimeout(unlock, 420);
      preload(((target + 1) % total));
      preload(((target - 1 + total) % total));
    });
  };
  loader.onerror = () => { clearTimeout(safetyTimer); unlock(); };
  loader.src = photos[target].src;
}

function preload(idx) { new Image().src = photos[idx].src; }

elA.src = photos[0].src;
elA.onload = () => elA.classList.add('visible');
if (elA.complete && elA.naturalWidth) elA.classList.add('visible');
updateUI(0);
preload(1); preload(2);

document.getElementById('zonePrev').addEventListener('click', () => show(current - 1));
document.getElementById('zoneNext').addEventListener('click', () => show(current + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  show(current - 1);
  if (e.key === 'ArrowRight') show(current + 1);
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 48) dx > 0 ? show(current - 1) : show(current + 1);
});

const stage = document.getElementById('stage');
stage.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
  cursor.classList.add('visible');
  cursor.classList.toggle('large', e.clientX / window.innerWidth < 0.38 || e.clientX / window.innerWidth > 0.62);
});
stage.addEventListener('mouseleave', () => { cursor.className = 'cursor'; });
</script>
</body>
